<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Registro diario de comidas y entrenamientos">
  <link rel="manifest" href="manifest.webmanifest?v=1.5.5">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Mi Entrenamiento</title>
  <link rel="stylesheet" href="css/style.css?v=1.5.5">
</head>
<body>
  <header id="app-header">
    <div id="header-titulos">
      <h1 id="header-title">Mi Entrenamiento</h1>
      <div id="header-sub">v1.5.5</div>
    </div>
    <button id="btn-sync" class="icon-btn" title="Sincronizar" aria-label="Sincronizar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      <span id="sync-dot" class="sync-dot"></span>
    </button>
  </header>

  <main id="view"></main>

  <nav id="tab-bar">
    <button class="tab-btn" data-view="hoy" aria-label="Hoy">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Hoy</span>
    </button>
    <button class="tab-btn" data-view="comida" aria-label="Comida">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-6 6c0 7 12 7 12 0 0-3.3-2.7-6-6-6z"/><path d="M8 1C5.8 3.2 5 6 5 8c0 2.2 1.2 4 3 4"/><path d="M8 1v12"/></svg>
      <span>Comida</span>
    </button>
    <button class="tab-btn" data-view="entreno" aria-label="Entrenamiento">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16"/><path d="M18 4v16"/><rect x="2" y="8" width="20" height="8" rx="4"/></svg>
      <span>Entreno</span>
    </button>
    <button class="tab-btn" data-view="semana" aria-label="Semana">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Semana</span>
    </button>
    <button class="tab-btn" data-view="ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/db.js?v=1.5.5"></script>
  <script src="js/app.js?v=1.5.5"></script>
</body>
</html>
